{% extends "index.html" %}
{% block title %}{{ 'Edit Expense' if expense else 'Add Expense' }}{% endblock %}
{% block content %}
<div class="card form-card">
  <form method="post">
    <label>Amount (₹)
      <input type="number" name="amount" step="0.01" min="0.01" required value="{{ expense.amount if expense }}">
    </label>
    <label>Category
      <select name="category" required>
        {% for c in categories %}<option value="{{ c }}" {{ 'selected' if expense and expense.category==c }}>{{ c }}</option>{% endfor %}
      </select>
    </label>
    <label>Date
      <input type="date" name="date" required value="{{ expense.date if expense else today }}">
    </label>
    <label>Description
      <textarea name="description" rows="3" placeholder="e.g. Lunch with friends">{{ expense.description if expense }}</textarea>
    </label>
    <div class="actions">
      <button class="btn" type="submit">{{ 'Update Expense' if expense else 'Save Expense' }}</button>
      <a class="btn ghost" href="{{ url_for('expenses') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
